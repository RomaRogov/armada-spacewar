ARMADA_DEVICE_ID=nothing-phone-1
ARMADA_DEVICE_NAME='Nothing Phone (1)'
ARMADA_SOC_CLASS=SM7325

# Native-portrait 1080x2400 AMOLED; gaming mode runs it landscape.
ARMADA_PANEL_ORIENTATION=left
# SC7280 DPU advertises 90-degree plane rotation (inline rotator) but rejects
# rotated RGB UBWC buffers, so every gamescope flip fails with EINVAL.
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=1
# gamescope's composite color-management pipeline shows only the red channel here.
ARMADA_GAMESCOPE_COLOR_MANAGEMENT_DISABLE=1
# rm692e5 reports no panel orientation; rotate in gamescope and rotate touch to
# match in udev (61-armada-touch-calibration.rules).
ARMADA_GAMESCOPE_FORCE_ORIENTATION=right
ARMADA_PRIMARY_TOUCHSCREEN=fts_ts
# No built-in gamepad: Steam sees an external USB-C/Bluetooth controller.
ARMADA_IP_TARGETS=deck-uhid,xbox-series,xb360,ds5

# Stock Qualcomm ABL (no ROCKNIX ABL, no SD card): Android boot header v3
# boot + vendor_boot written to the active A/B slot, root in a GPT inside
# userdata. See /usr/lib/armada/bootimg-android-v3.
ARMADA_BOOT_METHOD=android-v3
ARMADA_BOOT_DTB=sm7325-nothing-spacewar-armada
# Extra early drivers for the slim android-v3 initramfs (build_files/
# 55-generate-initramfs.sh): none. Display clocks, panel and USB PHY all
# bind from the real root; probing them early under the ABL's live splash
# intermittently hung the boot.
ARMADA_BOOT_INITRD_DRIVERS=''
# armada.userdata_subparts: initrd maps the GPT inside userdata (dracut
# 91armada-userdata-subparts). modprobe.blacklist + armada.rproc_sequential:
# the four remoteprocs autobooting together drop USB; armada-rproc-sequential
# starts them one at a time once userspace is up. deferred_probe_timeout=-1:
# the slim android-v3 initramfs lacks the display/GPU clock drivers, so with
# fw_devlink.strict the default 10 s timeout fails msm-mdss and the GPU SMMU
# for good before the real root can load them. *_ignore_unused: with the display
# still deferred, the 30 s unused-resource cleanup cuts refgen/clocks under the
# ABL's live splash and the bus hang resets the phone. initcall_blacklist:
# simpledrm enabling the DSI clocks under that splash (DSI PLL lock failed)
# intermittently wedged the display bus and froze boot ~10 s in; the ABL
# splash stays up untouched until msm takes over.
ARMADA_BOOT_EXTRA_CMDLINE='armada.userdata_subparts armada.rproc_sequential modprobe.blacklist=qcom_q6v5_pas deferred_probe_timeout=-1 clk_ignore_unused pd_ignore_unused regulator_ignore_unused initcall_blacklist=simpledrm_platform_driver_init'
# Snapdragon Sensor Core IMU behind the ADSP (armada-ssc-imu -> sns_iio -> InputPlumber).
ARMADA_SSC_IMU=1
